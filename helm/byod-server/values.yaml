replicaCount: 1
image:
  repository: ghcr.io/bit-precise/byod-server
  tag: 0.6.0
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8787
  tunnelPort: 8788
tunnel:
  # Public host:port advertised to BYOD Browser. It must resolve to a raw TCP
  # listener; the HTTP Ingress below cannot carry this traffic.
  endpoint: ""
  # Optional endpoint for clients in privateCIDRs. If unset, endpoint is used
  # for every client.
  privateEndpoint: ""
  # Comma-separated client CIDRs that should receive privateEndpoint.
  privateCIDRs: ""
  service:
    enabled: false
    type: LoadBalancer
    port: 443
    annotations: {}
examOrigin: https://exam.cs.ac.cn
upstream: http://exam-upstream:9000
devAuth: false
policyFile: /etc/byod/policy/policy.json
policyJson: '{}'
oidc:
  issuer: ""
  clientId: ""
  redirectUrl: https://exam.cs.ac.cn/oidc/callback
  existingSecret: ""
  clientSecretKey: client-secret
adminEmails: ""
# Comma-separated verified OIDC email addresses that bootstrap as administrators.
logging:
  # JSON logs are indexed by Kubernetes log collectors by default.
  format: json
  level: info
database:
  existingSecret: ""
  urlKey: database-url
migration:
  enabled: true
  image: {}
  extraArgs: []
admin:
  existingSecret: ""
  tokenKey: admin-token
policySecret:
  existingSecret: ""
  key: policy-secret
  # Required for production. Set this only for local development.
  value: ""
ingress:
  enabled: false
  className: nginx
  host: exam.cs.ac.cn
  tlsSecret: byod-exam-tls
resources: {}
