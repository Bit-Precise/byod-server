name: byod-server
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: .}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: admin-ui/package-lock.json}
      - name: Generate Go contract
        run: go generate ./internal/admin
      - name: Check generated Go contract
        run: git diff --exit-code -- internal/admin/api.gen.go
      - name: Generate TypeScript client
        working-directory: admin-ui
        run: npm ci && npm run generate:api
      - name: Check generated TypeScript client
        run: git diff --exit-code -- admin-ui/src/api/generated.ts
      - name: Build UI
        working-directory: admin-ui
        run: npm run typecheck && npm run build
      - name: Test server
        run: GOCACHE=/tmp/go-build-cache go test ./...
      - name: Vet server
        run: go vet ./...
      - name: Build container
        run: docker build -t byod-server:ci .
