name: BYOD middleware

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '**'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - '**'
      - '.github/workflows/release.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go.sum
      - uses: azure/setup-helm@v4
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...
      - name: Lint chart
        run: helm lint helm/byod-middleware

  publish:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_name="ghcr.io/${owner}/byod-server"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "chart_repository=oci://ghcr.io/${owner}/charts" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "${image_name}:${version}"
            echo "${image_name}:latest"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: azure/setup-helm@v4
      - name: Publish chart to GHCR OCI
        env:
          HELM_VERSION: ${{ steps.meta.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin <<< "$GITHUB_TOKEN"
          mkdir -p .artifacts
          helm package helm/byod-middleware \
            --version "$HELM_VERSION" \
            --app-version "$HELM_VERSION" \
            --destination .artifacts
          helm push .artifacts/byod-middleware-${HELM_VERSION}.tgz \
            "${{ steps.meta.outputs.chart_repository }}"
